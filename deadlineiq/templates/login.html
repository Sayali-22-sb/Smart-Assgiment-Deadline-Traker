<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DeadlineIQ — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0b0f;--surface:#12141a;--border:#252836;
  --accent:#6c63ff;--accent-soft:#6c63ff22;--accent-glow:#6c63ff44;
  --text:#e8eaf0;--muted:#6b7090;--dim:#3d4060;
  --green:#2dd4a0;--red:#ff5f6d;--gold:#f5a623;
}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.grid-bg{position:fixed;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:40px 40px;opacity:.3;pointer-events:none}
.glow{position:fixed;width:600px;height:600px;background:radial-gradient(circle,var(--accent-glow) 0%,transparent 70%);top:-200px;left:-200px;pointer-events:none}
.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:40px 36px;width:420px;position:relative;z-index:1;box-shadow:0 32px 80px #000a}
.logo{text-align:center;margin-bottom:32px}
.logo-mark{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;letter-spacing:-1px}
.logo-mark span{color:var(--accent)}
.logo-sub{font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-top:3px}
h2{font-family:'Syne',sans-serif;font-size:20px;font-weight:700;margin-bottom:6px}
.subtitle{font-size:13px;color:var(--muted);margin-bottom:28px}
.field{margin-bottom:16px}
label{display:block;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;margin-bottom:5px}
input{width:100%;background:#1a1d26;border:1px solid var(--border);border-radius:8px;padding:10px 13px;font-size:14px;color:var(--text);outline:none;font-family:'DM Sans',sans-serif;transition:border .15s}
input:focus{border-color:var(--accent)}
input::placeholder{color:var(--dim)}
.btn{width:100%;padding:11px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;margin-top:8px}
.btn:hover{background:#7c74ff;box-shadow:0 6px 24px var(--accent-glow)}
.btn:active{transform:scale(.98)}
.link-row{text-align:center;margin-top:20px;font-size:13px;color:var(--muted)}
.link-row a{color:var(--accent);text-decoration:none;font-weight:500}
.error{background:#ff5f6d18;border:1px solid #ff5f6d44;border-radius:8px;padding:10px 13px;font-size:13px;color:var(--red);margin-bottom:16px;display:none}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0}
.divider hr{flex:1;border:none;border-top:1px solid var(--border)}
.divider span{font-size:11px;color:var(--dim)}
.demo-btn{width:100%;padding:10px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-glow);border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s}
.demo-btn:hover{background:var(--accent-glow)}
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="glow"></div>
<div class="card">
  <div class="logo">
    <div class="logo-mark">Dead<span>line</span>IQ</div>
    <div class="logo-sub">Smart Assignment Tracker</div>
  </div>
  <h2>Welcome back</h2>
  <p class="subtitle">Sign in to manage your deadlines</p>
  <div class="error" id="err"></div>
  <div class="field"><label>Email</label><input type="email" id="email" placeholder="you@university.edu" autocomplete="email"></div>
  <div class="field"><label>Password</label><input type="password" id="pw" placeholder="••••••••" autocomplete="current-password"></div>
  <button class="btn" onclick="login()">Sign In</button>
  <div class="divider"><hr><span>OR</span><hr></div>
  <button class="demo-btn" onclick="demo()">✦ Try Demo Account</button>
  <div class="link-row">Don't have an account? <a href="/register">Sign up</a></div>
</div>
<script>
async function login(){
  const email=document.getElementById('email').value;
  const pw=document.getElementById('pw').value;
  const err=document.getElementById('err');
  err.style.display='none';
  const r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pw})});
  const d=await r.json();
  if(d.ok){location.href='/dashboard'}
  else{err.textContent=d.error||'Login failed';err.style.display='block'}
}
async function demo(){
  // auto-fill demo credentials
  document.getElementById('email').value='demo@deadlineiq.com';
  document.getElementById('pw').value='demo1234';
  // try login first, register if needed
  const r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:'demo@deadlineiq.com',password:'demo1234'})});
  const d=await r.json();
  if(d.ok){location.href='/dashboard'}
  else{
    const r2=await fetch('/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'Demo Student',email:'demo@deadlineiq.com',password:'demo1234'})});
    const d2=await r2.json();
    if(d2.ok){location.href='/dashboard'}
  }
}
document.addEventListener('keydown',e=>{if(e.key==='Enter')login()});
</script>
</body>
</html>
